name: Build GOshare Android App (Automated Cloud Build)

on:
  push:
    branches:
      - main
      - android-app
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets & Sync Capacitor
        run: npm run cap:sync

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Android Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Prepare Release APK Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GOshare-Android-App.apk

      - name: Create or Update GitHub Tag & Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "GOshare Android App Official Release"
          body: "Official Android Application (.apk) for GOshare Cloud Sharing Platform."
          draft: false
          prerelease: false
          files: GOshare-Android-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOshare-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOshare-Android-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
