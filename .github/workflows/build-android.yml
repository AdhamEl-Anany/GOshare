name: Build GOshare Android App (Automated Cloud Build)

on:
  push:
    branches:
      - main
      - android-app
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Assets & Capacitor Sync
        run: |
          mkdir -p www
          cp -r index.html auth.html dashboard.html file.html pricing.html admin.html css js assets www/
          npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK & Release Bundle
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOshare-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release Unsigned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOshare-Android-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOshare-Android-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
